version = 1
policy = "internal-json-deny"

[scanner]
internal_roots = [".simplicio/orchestrator", ".simplicio"]
formats = [".json", ".jsonl", ".ndjson"]

[[exceptions]]
path = ".simplicio/orchestrator/savings/snapshots.jsonl"
category = "legacy-internal"
target = "hbp"
owner = "loop"
reason = "migrate append-only savings snapshots to Runtime HBP v1"
expires = "2026-09-30"

[[exceptions]]
path = ".simplicio/skills/simplicio-prism/references/capability-record.schema.json"
category = "plugin-contract"
target = "skill-schema"
owner = "loop"
reason = "classify the checked-in Prism capability-record schema outside orchestrator state"
expires = "2027-01-31"
