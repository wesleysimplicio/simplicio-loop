name: release-train-reconcile

on:
  repository_dispatch:
    types: [simplicio.component-release.v1, simplicio.component-release-event/v1]

concurrency:
  group: release-train-reconcile
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install release-train test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Reconcile latest compatible release
        id: reconcile
        env:
          EVENT_FILE: ${{ github.event_path }}
        run: |
          python scripts/release_train_reconciler.py reconcile \
            --repo "$GITHUB_WORKSPACE" \
            --event "$EVENT_FILE" \
            --output "$RUNNER_TEMP/reconciliation.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          receipt = json.loads(Path(os.environ["RUNNER_TEMP"], "reconciliation.json").read_text())
          print(json.dumps(receipt, sort_keys=True))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"status={receipt.get('status', 'blocked')}\n")
              output.write(f"release_id={receipt.get('release_id', 'unknown')}\n")
          if receipt.get("status") == "blocked":
              raise SystemExit("release-train reconciliation blocked: " + "; ".join(receipt.get("errors", [])))
          PY

      - name: Run release-train checks
        if: steps.reconcile.outputs.status == 'changed'
        run: |
          python -m pytest -q \
            tests/test_release_train_reconciler_558.py \
            tests/test_release_train_engine.py \
            tests/test_issue_558_release_train_slot.py

      - name: Prepare one idempotent bump branch
        if: steps.reconcile.outputs.status == 'changed'
        env:
          BRANCH: release-train/latest-compatible
          RELEASE_ID: ${{ steps.reconcile.outputs.release_id }}
        run: |
          git config user.name "simplicio-release-train[bot]"
          git config user.email "simplicio-release-train[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add pyproject.toml .simplicio/release-train.lock.json
          git commit -m "chore(release-train): propagate ${RELEASE_ID}" \
            -m "Refs #558"
          git push --force-with-lease origin "HEAD:$BRANCH"

      - name: Open or reuse the bump PR
        if: steps.reconcile.outputs.status == 'changed'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: release-train/latest-compatible
          RELEASE_ID: ${{ steps.reconcile.outputs.release_id }}
        run: |
          existing="$(gh pr list --base main --head "$BRANCH" --state open --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            echo "Reusing PR #$existing for release $RELEASE_ID"
            exit 0
          fi
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(release-train): propagate latest compatible release" \
            --body "$(cat <<EOF
          Automated reconciliation for release-train #558.

          The workflow consumed release event \`$RELEASE_ID\`, selected the newest candidate inside the existing direct-dependency range, and recorded commit/digest evidence in the lock receipt. Upper bounds and incompatible candidates are fail-closed.

          Checks: \`tests/test_release_train_reconciler_558.py\`, \`tests/test_release_train_engine.py\`, \`tests/test_issue_558_release_train_slot.py\`
          EOF
          )"
